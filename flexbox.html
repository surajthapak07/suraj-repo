<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
body{
    margin: 0;
    padding: 0;
}
html,*{
    margin: 0;
    padding: 0;
    box-sizing:border-box;  
}
div{
    width:  400px;
    height: 500px;
    background-color: lightblue;
    margin: 10px 20px;
    padding: 20px 40px;
    border: 5px dashed #9e5d12
    
}
p{
    background-color: palevioletred;
    padding: 20px;
    border: 10px solid #c71028;
    margin: 20px;
}



    </style>
</head>
<body>
    <div>
        <p>
            This is a simple example of a flexbox layout. Flexbox is a CSS layout module that makes it easier to design flexible responsive layout structures without using float or positioning.
        </p>
    </div>

</body>
</html>
