<html>
    <head>
        <title>Layout 01</title>
   
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        html,*{
            margin: 0;
            padding: 0;
        }
        #main{
            width:900px;
            height:1000px;
            background-color: #999;
            margin: 0 auto;
            display: flex;
            flex-direction: row-reverse;
            gap: 10px;

        }
        #right{
            flex-grow: 1;
            height: 1000px;
            background-color: #888;
        }
        #left{
            flex-grow: 2;
            height: 1000px;
            background-color: #888;
            display: flex;
            flex-direction: column;
        }
        header, main, footer{
            background-color: #888;
        }
    </style>
     </head>
     <body>
        
        <div id="main">
            <div id="right">
                <h2>Right box</h2>
            </div>

            <div id="left">
                
                <header><h2>Header</h2></header>
                <main><h2>Main Content</h2></main>
                <footer><h2>Footer</h2></footer>
            </div>
        </div>
     </body>
    
</html>
